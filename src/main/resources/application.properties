# ============================================================
# Configuración del Servidor
# ============================================================
server.port=${PORT:8080}

# ============================================================
# Metadata de la API (OpenAPI / Swagger)
# ============================================================
api.info.title=Products API
api.info.description=Microservicio CRUD de Productos construido con Spring Boot 3, Java 21 y MongoDB. Arquitectura Hexagonal
api.info.version=0.0.1-SNAPSHOT
api.info.contact.name=Nelson Parra - 1010205795
api.info.contact.email=njaparrah@poligran.edu.co
api.info.contact.url=https://github.com/zyozmen/Products
api.info.license.name=MIT License
api.info.license.url=https://opensource.org/licenses/MIT

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Ruta de la UI de Swagger
springdoc.swagger-ui.path=/swagger-ui.html
# Ruta del JSON de la especificación OpenAPI
springdoc.api-docs.path=/v3/api-docs

management.health.mongo.enabled=false

# ============================================================
# Configuración de JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=update

# se evita que se muestren las consultas SQL en la consola para no saturar los logs
spring.jpa.show-sql=true

# Formatea el SQL para que sea más legible en los logs
spring.jpa.properties.hibernate.format_sql=true

# Dialecto específico de MySQL 8 para que Hibernate genere SQL optimizado
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Nombre de la base de datos al que Hibernate mapeará las entidades
spring.jpa.properties.hibernate.default_schema=products_db

# ============================================================
# Configuración de Springdoc OpenAPI (Swagger UI)
# ============================================================

# Ordena los endpoints en la UI por método HTTP
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# Información de la Aplicación (aparece en Swagger UI)
# ============================================================
spring.application.name=products-api

# ============================================================
# Configuración de MongoDB
# ============================================================

# Por defecto se usa una URI local para desarrollo y ramas no productivas.
# Para otros ambientes, toma la conexión de la variable de entorno SPRING_DATA_MONGODB_URI.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://growShop:GrowSh0p@localhost:27017/}
spring.data.mongodb.database=${MONGO_DATABASE:${MONGODB_DATABASE:GrowShop}}

# ============================================================
# Logging para MongoDB
# ============================================================
# DEBUG expone las queries completas (incluye datos); en Render usa INFO o superior.
logging.level.org.springframework.data.mongodb.core.MongoTemplate=${LOG_LEVEL_MONGO_TEMPLATE:INFO}
logging.level.org.mongodb.driver.protocol.command=${LOG_LEVEL_MONGO_COMMAND:INFO}

# ============================================================
# Seguridad: JWT y usuario administrador por defecto
# ============================================================
# Clave secreta usada para firmar los JWT. SIEMPRE configúrala vía variable
# de entorno en producción; el valor por defecto solo es apto para desarrollo.
app.jwt.secret=${JWT_SECRET:}
# Tiempo de expiración del token en milisegundos (por defecto 24 horas).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Credenciales del administrador principal, sembradas al arrancar si no existen.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
